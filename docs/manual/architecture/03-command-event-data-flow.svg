<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1160" viewBox="0 0 1900 1160" role="img" aria-labelledby="title desc">
  <title id="title">BlaXquad command and event data flow</title>
  <desc id="desc">How user commands reach a Copilot role session and how provider events return through authoritative state to the dashboard.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c084fc"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/></marker>
    <style>
      .title { font: 700 34px "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px "Segoe UI", sans-serif; fill: #a8b3c7; }
      .flow-title { font: 800 14px "Segoe UI", sans-serif; letter-spacing: 1.4px; }
      .node-title { font: 700 18px "Segoe UI", sans-serif; fill: #f8fafc; }
      .node-subtitle { font: 600 14px "Segoe UI", sans-serif; fill: #dbeafe; }
      .body { font: 400 13px "Segoe UI", sans-serif; fill: #cbd5e1; }
      .path { font: 600 11px Consolas, monospace; fill: #7dd3fc; }
      .path-purple { font: 600 11px Consolas, monospace; fill: #d8b4fe; }
      .path-green { font: 600 11px Consolas, monospace; fill: #6ee7b7; }
      .edge { font: 600 12px "Segoe UI", sans-serif; fill: #e2e8f0; }
      .badge { font: 700 11px "Segoe UI", sans-serif; fill: #e2e8f0; }
      .step { font: 800 13px "Segoe UI", sans-serif; fill: #0b1020; }
      .loop-title { font: 700 16px "Segoe UI", sans-serif; fill: #f5d0fe; }
      .loop { font: 400 13px "Segoe UI", sans-serif; fill: #e9d5ff; }
    </style>
  </defs>
  <rect width="1900" height="1160" fill="#0b1020"/>
  <text x="48" y="54" class="title">Where does a prompt go, and how does output return?</text>
  <text x="48" y="84" class="subtitle">The upper path is command/control. The lower path is the ordered event-to-state-to-presentation pipeline.</text>

  <rect x="40" y="118" width="1820" height="302" rx="22" fill="#0e1729" stroke="#334155"/>
  <rect x="58" y="101" width="200" height="34" rx="17" fill="#102a43" stroke="#38bdf8"/>
  <text x="158" y="123" text-anchor="middle" class="flow-title" fill="#7dd3fc">COMMAND PATH</text>

  <!-- Command path -->
  <g>
    <circle cx="86" cy="180" r="15" fill="#c084fc"/><text x="86" y="185" text-anchor="middle" class="step">1</text>
    <rect x="70" y="204" width="230" height="158" rx="16" fill="#2b1f45" stroke="#c084fc" stroke-width="2"/>
    <text x="92" y="235" class="node-title">Vue Dashboard</text>
    <text x="92" y="255" class="body">prompts and aborts</text>
    <text x="92" y="275" class="body">interaction responses</text>
    <text x="92" y="295" class="body">transcript page / entry requests</text>
    <text x="92" y="323" class="path-purple">useDashboardSession.ts</text>
    <text x="92" y="343" class="path-purple">protocol/bridge.ts</text>

    <circle cx="365" cy="180" r="15" fill="#c084fc"/><text x="365" y="185" text-anchor="middle" class="step">2</text>
    <rect x="349" y="204" width="242" height="158" rx="16" fill="#2b1f45" stroke="#c084fc" stroke-width="2"/>
    <text x="371" y="235" class="node-title">Photino command router</text>
    <text x="371" y="261" class="body">validates envelope + payload;</text>
    <text x="371" y="281" class="body">calls ISquadUi / ITranscriptUi</text>
    <text x="371" y="316" class="path-purple">PhotinoUiCommandHandler.cs</text>

    <circle cx="656" cy="180" r="15" fill="#38bdf8"/><text x="656" y="185" text-anchor="middle" class="step">3</text>
    <rect x="640" y="204" width="258" height="158" rx="16" fill="#102a43" stroke="#38bdf8" stroke-width="2"/>
    <text x="662" y="235" class="node-title">SquadViewModel</text>
    <text x="662" y="261" class="body">tracks accepted commands;</text>
    <text x="662" y="281" class="body">marks role working; routes action</text>
    <text x="662" y="316" class="path">SquadViewModel.cs</text>

    <circle cx="963" cy="180" r="15" fill="#38bdf8"/><text x="963" y="185" text-anchor="middle" class="step">4</text>
    <rect x="947" y="204" width="270" height="158" rx="16" fill="#102a43" stroke="#38bdf8" stroke-width="2"/>
    <text x="969" y="235" class="node-title">Per-role operation gate</text>
    <text x="969" y="261" class="body">serializes same-role prompts;</text>
    <text x="969" y="281" class="body">leases only current live session</text>
    <text x="969" y="316" class="path">RoleOperationCoordinator.cs</text>
    <text x="969" y="336" class="path">SessionRegistry.cs</text>

    <circle cx="1282" cy="180" r="15" fill="#34d399"/><text x="1282" y="185" text-anchor="middle" class="step">5</text>
    <rect x="1266" y="204" width="270" height="158" rx="16" fill="#123b36" stroke="#34d399" stroke-width="2"/>
    <text x="1288" y="235" class="node-title">Role session wrapper</text>
    <text x="1288" y="261" class="body">Send / Abort / Respond;</text>
    <text x="1288" y="281" class="body">holds waiting interaction promises</text>
    <text x="1288" y="316" class="path-green">CopilotSdkAgentSession.cs</text>

    <circle cx="1601" cy="180" r="15" fill="#34d399"/><text x="1601" y="185" text-anchor="middle" class="step">6</text>
    <rect x="1585" y="204" width="244" height="158" rx="16" fill="#123b36" stroke="#34d399" stroke-width="2"/>
    <text x="1607" y="235" class="node-title">Copilot child process</text>
    <text x="1607" y="261" class="body">provider conversation, model,</text>
    <text x="1607" y="281" class="body">tools in the role worktree</text>
    <text x="1607" y="316" class="path-green">SDK RuntimeConnection.ForStdio()</text>
  </g>

  <path d="M300 273 H349" fill="none" stroke="#c084fc" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="305" y="259" class="edge">JSON v3</text>
  <path d="M470 362 V392 H185 V362" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowPurple)"/>
  <text x="220" y="386" class="edge">on-demand history result</text>
  <path d="M591 273 H640" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="598" y="259" class="edge">typed call</text>
  <path d="M898 273 H947" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="899" y="259" class="edge">dispatch</text>
  <path d="M1217 273 H1266" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="1219" y="259" class="edge">lease</text>
  <path d="M1536 273 H1585" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1539" y="259" class="edge">SDK / stdio</text>

  <rect x="970" y="375" width="246" height="28" rx="14" fill="#1e3a5f"/>
  <text x="1093" y="394" text-anchor="middle" class="badge">same role serial; different roles concurrent</text>

  <!-- Event path -->
  <rect x="40" y="460" width="1820" height="354" rx="22" fill="#0e1729" stroke="#334155"/>
  <rect x="58" y="443" width="228" height="34" rx="17" fill="#123b36" stroke="#34d399"/>
  <text x="172" y="465" text-anchor="middle" class="flow-title" fill="#6ee7b7">EVENT + STATE PATH</text>

  <g>
    <circle cx="1648" cy="515" r="15" fill="#34d399"/><text x="1648" y="520" text-anchor="middle" class="step">7</text>
    <rect x="1518" y="540" width="280" height="174" rx="16" fill="#123b36" stroke="#34d399" stroke-width="2"/>
    <text x="1540" y="571" class="node-title">SDK callback translator</text>
    <text x="1540" y="597" class="body">maps messages, reasoning, usage,</text>
    <text x="1540" y="617" class="body">skills and errors; normalizes tools</text>
    <text x="1540" y="650" class="path-green">CopilotSdkClient.cs</text>
    <text x="1540" y="670" class="path-green">CopilotToolEventNormalizer.cs</text>
    <text x="1540" y="693" class="body">optional tap: BLAXQUAD_SDK_EVENT_TRACE</text>

    <circle cx="1324" cy="515" r="15" fill="#34d399"/><text x="1324" y="520" text-anchor="middle" class="step">8</text>
    <rect x="1200" y="540" width="280" height="174" rx="16" fill="#123b36" stroke="#34d399" stroke-width="2"/>
    <text x="1222" y="571" class="node-title">AgentEventChannel</text>
    <text x="1222" y="597" class="body">one ordered bounded channel</text>
    <text x="1222" y="617" class="body">per role session (capacity 100)</text>
    <text x="1222" y="650" class="path-green">AgentProvider.Abstractions/</text>
    <text x="1222" y="670" class="path-green">AgentEventChannel.cs</text>
    <text x="1222" y="693" class="body">sustained overflow fails the session</text>

    <circle cx="1006" cy="515" r="15" fill="#38bdf8"/><text x="1006" y="520" text-anchor="middle" class="step">9</text>
    <rect x="882" y="540" width="280" height="174" rx="16" fill="#102a43" stroke="#38bdf8" stroke-width="2"/>
    <text x="904" y="571" class="node-title">SessionGeneration observer</text>
    <text x="904" y="597" class="body">one async observer per session;</text>
    <text x="904" y="617" class="body">forwards event and watches Completion</text>
    <text x="904" y="650" class="path">SessionGeneration.cs</text>

    <circle cx="688" cy="515" r="15" fill="#38bdf8"/><text x="688" y="520" text-anchor="middle" class="step">10</text>
    <rect x="564" y="540" width="280" height="174" rx="16" fill="#102a43" stroke="#38bdf8" stroke-width="2"/>
    <text x="586" y="571" class="node-title">Command queue + projector</text>
    <text x="586" y="597" class="body">single-reader state mutation queue;</text>
    <text x="586" y="617" class="body">projects under the role SyncRoot</text>
    <text x="586" y="650" class="path">SquadViewModel.cs</text>
    <text x="586" y="670" class="path">AgentEventProjector.cs</text>

    <circle cx="370" cy="515" r="15" fill="#f59e0b"/><text x="370" y="520" text-anchor="middle" class="step">11</text>
    <rect x="246" y="540" width="280" height="174" rx="16" fill="#3b2a16" stroke="#f59e0b" stroke-width="2"/>
    <text x="268" y="571" class="node-title">Authoritative role state</text>
    <text x="268" y="597" class="body">status + usage + pending interactions;</text>
    <text x="268" y="617" class="body">sequenced RoleTranscriptState</text>
    <text x="268" y="650" class="path">AgentRoleState.cs</text>
    <text x="268" y="670" class="path">squad.Transcripts/</text>
    <text x="268" y="693" class="body">bounded history spills to temp files</text>

    <circle cx="86" cy="515" r="15" fill="#c084fc"/><text x="86" y="520" text-anchor="middle" class="step">12</text>
    <rect x="70" y="540" width="138" height="174" rx="16" fill="#2b1f45" stroke="#c084fc" stroke-width="2"/>
    <text x="91" y="571" class="node-title">Delivery</text>
    <text x="91" y="597" class="body">deferred: 33 ms</text>
    <text x="91" y="617" class="body">coalescing;</text>
    <text x="91" y="637" class="body">immediate bypass;</text>
    <text x="91" y="657" class="body">snapshot / sync / update</text>
    <text x="84" y="687" class="path-purple">PhotinoUiDelivery</text>
    <text x="84" y="704" class="path-purple">Coordinator.cs</text>
  </g>

  <path d="M1707 362 V540" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1722" y="454" class="edge">SDK callbacks</text>
  <path d="M1518 627 H1480" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M1200 627 H1162" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M882 627 H844" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M564 627 H526" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M246 627 H208" fill="none" stroke="#c084fc" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M139 540 V396 H185 V362" fill="none" stroke="#c084fc" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="83" y="432" class="edge">JSON v3 to Vue</text>

  <rect x="86" y="738" width="1670" height="48" rx="12" fill="#162033" stroke="#334155"/>
  <text x="106" y="767" class="body">Ordering contract: provider order is preserved per session; state and transcript change atomically; sequence gaps or delivery overflow force transcript resynchronization rather than guessing.</text>

  <!-- Interaction loop -->
  <rect x="40" y="850" width="1820" height="246" rx="22" fill="#21152f" stroke="#c084fc" stroke-width="2"/>
  <text x="70" y="885" class="loop-title">Permission / input / elicitation loop (the SDK callback waits)</text>

  <g>
    <rect x="70" y="920" width="252" height="112" rx="14" fill="#2b1f45" stroke="#c084fc"/>
    <text x="90" y="947" class="node-subtitle">1. Provider asks</text>
    <text x="90" y="972" class="loop">CopilotSdkClient callback enters</text>
    <text x="90" y="992" class="loop">the role session.</text>

    <rect x="366" y="920" width="252" height="112" rx="14" fill="#2b1f45" stroke="#c084fc"/>
    <text x="386" y="947" class="node-subtitle">2. Session suspends</text>
    <text x="386" y="972" class="loop">Create request ID + TaskCompletionSource;</text>
    <text x="386" y="992" class="loop">publish typed AgentEvent.</text>

    <rect x="662" y="920" width="252" height="112" rx="14" fill="#2b1f45" stroke="#c084fc"/>
    <text x="682" y="947" class="node-subtitle">3. C# owns pending state</text>
    <text x="682" y="972" class="loop">Projector registers request and protects</text>
    <text x="682" y="992" class="loop">its transcript entry.</text>

    <rect x="958" y="920" width="252" height="112" rx="14" fill="#2b1f45" stroke="#c084fc"/>
    <text x="978" y="947" class="node-subtitle">4. Dashboard responds</text>
    <text x="978" y="972" class="loop">Snapshot renders interaction; JSON reply</text>
    <text x="978" y="992" class="loop">includes role + requestId.</text>

    <rect x="1254" y="920" width="252" height="112" rx="14" fill="#2b1f45" stroke="#c084fc"/>
    <text x="1274" y="947" class="node-subtitle">5. Exact session resumes</text>
    <text x="1274" y="972" class="loop">ViewModel validates owner, completes the</text>
    <text x="1274" y="992" class="loop">session promise, then unprotects entry.</text>

    <rect x="1550" y="920" width="270" height="112" rx="14" fill="#2b1f45" stroke="#c084fc"/>
    <text x="1570" y="947" class="node-subtitle">6. Callback returns to SDK</text>
    <text x="1570" y="972" class="loop">Approval, answer, or structured result</text>
    <text x="1570" y="992" class="loop">continues the provider operation.</text>
  </g>

  <path d="M322 976 H366" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M618 976 H662" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M914 976 H958" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M1210 976 H1254" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M1506 976 H1550" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <text x="48" y="1133" class="path">Key contracts: IAgentSession + AgentEvent (squad.AgentProvider.Abstractions), ISquadUi + ITranscriptUi (squad.Ui.Abstractions), Envelope version 3 (squad-ui/src/protocol/messages.ts)</text>
</svg>
